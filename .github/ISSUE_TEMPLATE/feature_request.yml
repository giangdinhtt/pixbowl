name: Feature request
description: Suggest an idea or an improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        pixbowl is deliberately small. Features that require a database,
        user accounts, or a UI beyond upload and delete are unlikely to be
        accepted — see the "Known limitations" section of the README.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the implementation you have in mind
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - upload
        - serving / caching
        - resize variants
        - storage backend
        - authentication
        - operations / deployment
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
