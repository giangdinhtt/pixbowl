services:
  pixbowl:
    build: .
    image: pixbowl:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      OUTPUT_FORMAT: webp
      KEEP_ORIGINAL: "true"
      MAX_FILE_MB: "10"
      # Only enable TRUST_PROXY behind Caddy/nginx, otherwise clients can
      # spoof X-Forwarded-For and bypass the rate limiter.
      # TRUST_PROXY: "true"
      # BASE_URL: "https://pix.example.com"
      # ADMIN_TOKEN: "change-me"
      # BASIC_AUTH: "alice:$2y$10$..."   # htpasswd -nbB -C 10 alice 'password' 
      # ALLOWED_ORIGINS: "https://app.example.com"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/liveness"]
      interval: 30s
      timeout: 3s
      retries: 3
