services:
  pixbowl:
    build: .
    image: pixbowl:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      OUTPUT_FORMAT: webp
      KEEP_ORIGINAL: "true"
      MAX_FILE_MB: "10"
      # Chỉ bật TRUST_PROXY khi server nằm sau Caddy/nginx, nếu không
      # kẻ tấn công có thể giả X-Forwarded-For để né rate limit.
      # TRUST_PROXY: "true"
      # BASE_URL: "https://pix.example.com"
      # ADMIN_TOKEN: "doi-thanh-chuoi-bi-mat"
      # ALLOWED_ORIGINS: "https://app.example.com"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/liveness"]
      interval: 30s
      timeout: 3s
      retries: 3
